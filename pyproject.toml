[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-ml"
version = "1.0.0"
description = "Manta: High-Performance Distributed Machine Learning Systems & MLOps Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chandra Vamsi", email = "avvaruchandravamsi30@gmail.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "typing_extensions>=4.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]
serving = [
    "torch>=2.0.0",
    "onnxruntime>=1.16.0",
    "tritonclient>=2.38.0"
]

[project.scripts]
mantactl = "manta.cli.main:main"
